# Claude Code attention marker.
#
# The hook script sets the window option @claude_attention on the window of a
# Claude Code session that waits for your input. These formats render the mark.
# The two tmux hooks remove the mark as soon as you look at the window.
#
# Source this file from ~/.tmux.conf:
#   source-file -q ~/.claude/plugins/cache/claude-tmux-attention/tmux-attention/*/tmux/claude-attention.conf

set -g window-status-format         "#{?@claude_attention,❗,}#I:#W#{?window_flags,#{window_flags}, }"
set -g window-status-current-format "#{?@claude_attention,❗,}#I:#W#{?window_flags,#{window_flags}, }"

set-hook -g session-window-changed  'set-option -w -u @claude_attention'
set-hook -g client-session-changed  'set-option -w -u @claude_attention'
